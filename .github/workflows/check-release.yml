name: Check release installation
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Download, verify and run R
        env:
          GH_TOKEN: ${{ github.token }}
          R_RUNTIME_VERSION: ${{ github.event.release.tag_name || 'v0.1.0' }}
        run: |
          time bash setup.sh "$RUNNER_TEMP/r-runtime"
          cd /tmp
          "$RUNNER_TEMP/r-runtime/bin/Rscript" "$GITHUB_WORKSPACE/scripts/smoke.R"
